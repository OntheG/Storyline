<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Main Story - Gathur Delano Kafka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        html, body {
            min-height: 100vh;
            background: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px;
            color: #111;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .page-wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER */
        header {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 28px;
            padding: 28px 20px 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.02);
            width: 100%;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .header-sub {
            color: #777;
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* SIDEBAR / NAVIGATION */
        .sidebar {
            width: 100%;
        }

        .navigation-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .nav-btn {
            background: #f8f8f8;
            border: 1px solid #dddddd;
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 550;
            font-size: 0.95rem;
            text-align: left;
            color: #1a1a1a;
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .nav-btn:hover {
            background: #222;
            color: white;
            border-color: #222;
            transform: translateY(-2px);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn .arrow {
            font-size: 0.8rem;
            transition: transform 0.25s ease;
        }

        .nav-btn.open .arrow {
            transform: rotate(180deg);
        }

        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding-left: 16px;
            margin-top: 4px;
            border-left: 2px solid #ddd;
            width: 100%;
        }

        .sub-menu.open {
            display: flex;
        }

        .sub-btn {
            background: transparent;
            border: none;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            width: 100%;
        }

        .sub-btn:hover {
            background: #f0f0f0;
            color: #000;
        }

        .sub-btn.active {
            background: #e8e8e8;
            font-weight: 600;
            color: #000;
        }

        /* CONTENT AREA - footer only */
        .content-area {
            width: 100%;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        footer {
            text-align: center;
            padding: 24px 12px 16px;
            border-top: 1px solid #e2e2e2;
            margin-top: 12px;
            color: #5a5a5a;
            width: 100%;
            font-size: 0.9rem;
        }

        footer p:last-child {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #999;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            body {
                padding: 32px 40px;
                justify-content: center;
            }

            .page-wrapper {
                max-width: 580px;
            }

            header {
                padding: 32px 28px 28px;
                border-radius: 32px;
            }

            .header-title {
                font-size: 2.4rem;
            }

            .nav-btn {
                padding: 16px 22px;
                font-size: 1rem;
                border-radius: 18px;
            }

            .sub-btn {
                padding: 10px 18px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px;
            }

            .page-wrapper {
                gap: 14px;
            }

            header {
                padding: 20px 14px 18px;
                border-radius: 22px;
            }

            .header-title {
                font-size: 1.7rem;
            }

            .header-sub {
                font-size: 0.8rem;
            }

            .nav-btn {
                padding: 12px 14px;
                font-size: 0.85rem;
                border-radius: 14px;
            }

            .sub-btn {
                padding: 8px 12px;
                font-size: 0.82rem;
            }

            .sub-menu {
                padding-left: 12px;
            }

            footer {
                padding: 18px 8px 12px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 8px 6px;
            }

            header {
                padding: 16px 10px 14px;
                border-radius: 18px;
            }

            .header-title {
                font-size: 1.4rem;
            }

            .nav-btn {
                padding: 10px 12px;
                font-size: 0.8rem;
                border-radius: 12px;
            }

            .sub-btn {
                padding: 6px 10px;
                font-size: 0.78rem;
            }
        }

        /* ===== FULLSCREEN PDF OVERLAY ===== */
        .pdf-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .pdf-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .pdf-overlay-content {
            width: 94%;
            max-width: 1100px;
            height: 85vh;
            max-height: 900px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: auto;
        }

        @keyframes slideUp {
            0% { transform: scale(0.92) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .pdf-overlay-header {
            padding: 16px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            flex-shrink: 0;
        }

        .pdf-overlay-header h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .pdf-overlay-close {
            background: none;
            border: none;
            font-size: 32px;
            color: #333;
            cursor: pointer;
            padding: 0 8px;
            transition: all 0.2s;
            line-height: 1;
        }

        .pdf-overlay-close:hover {
            color: #000;
            transform: scale(1.1);
        }

        .pdf-overlay-body {
            flex: 1;
            background: #f1f3f5;
            padding: 20px;
            overflow: hidden;
            min-height: 0;
        }

        .pdf-overlay-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .pdf-placeholder-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1.1rem;
            background: #fafafa;
            border-radius: 12px;
        }

        .pdf-placeholder-text i {
            font-size: 40px;
            margin-right: 14px;
            color: #ccc;
        }

        /* ===== PDF OVERLAY RESPONSIVE ===== */
        @media (max-width: 768px) {
            .pdf-overlay {
                padding: 24px 16px;
            }

            .pdf-overlay-content {
                width: 98%;
                height: 88vh;
                max-height: none;
                border-radius: 20px;
            }

            .pdf-overlay-header {
                padding: 14px 18px;
            }

            .pdf-overlay-header h3 {
                font-size: 1rem;
                max-width: 70%;
            }

            .pdf-overlay-close {
                font-size: 28px;
            }

            .pdf-overlay-body {
                padding: 14px;
            }
        }

        @media (max-width: 480px) {
            .pdf-overlay {
                padding: 16px 10px;
            }

            .pdf-overlay-content {
                width: 100%;
                height: 92vh;
                border-radius: 16px;
            }

            .pdf-overlay-header {
                padding: 12px 14px;
            }

            .pdf-overlay-header h3 {
                font-size: 0.9rem;
                max-width: 70%;
            }

            .pdf-overlay-close {
                font-size: 24px;
            }

            .pdf-overlay-body {
                padding: 10px;
            }
        }

        @media (max-width: 380px) {
            .pdf-overlay {
                padding: 10px 6px;
            }

            .pdf-overlay-content {
                height: 95vh;
                border-radius: 12px;
            }

            .pdf-overlay-header {
                padding: 10px 12px;
            }

            .pdf-overlay-header h3 {
                font-size: 0.8rem;
            }

            .pdf-overlay-close {
                font-size: 22px;
            }

            .pdf-overlay-body {
                padding: 6px;
            }
        }

        /* Landscape phone */
        @media (max-height: 500px) and (orientation: landscape) {
            .pdf-overlay {
                padding: 12px 20px;
            }

            .pdf-overlay-content {
                height: 90vh;
                max-height: 600px;
                border-radius: 16px;
            }

            .pdf-overlay-header {
                padding: 10px 16px;
            }

            .pdf-overlay-header h3 {
                font-size: 0.9rem;
            }

            .pdf-overlay-body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <!-- HEADER -->
        <header>
            <div class="header-container">
                <h1 class="header-title">Main Story</h1>
                <p class="header-sub">Kafka's Universe</p>
            </div>
        </header>

        <!-- NAVIGATION -->
        <div class="sidebar">
            <div class="navigation-buttons">
                <!-- The Jackdaw -->
                <div class="nav-btn" data-target="jackdaw">
                    <span>The Jackdaw</span>
                    <span class="arrow"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="sub-menu" id="sub-jackdaw">
                    <button class="sub-btn" data-title="The Jackdaw - Chapter 1">Chapter 1</button>
                    <button class="sub-btn" data-title="The Jackdaw - Chapter 2">Chapter 2</button>
                    <button class="sub-btn" data-title="The Jackdaw - Chapter 3">Chapter 3</button>
                    <button class="sub-btn" data-title="The Jackdaw - Chapter 4">Chapter 4</button>
                    <button class="sub-btn" data-title="The Jackdaw - Chapter 5">Chapter 5</button>
                </div>

                <!-- A Language of Threats -->
                <div class="nav-btn" data-target="threats">
                    <span>A Language of Threats</span>
                    <span class="arrow"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="sub-menu" id="sub-threats">
                    <button class="sub-btn" data-title="ALOT - Chapter 1" data-pdf="https://drive.google.com/file/d/1cVY89y0fWVxdY155LNuMTwwuSFHOA_mG/preview">Chapter 1</button>
                    <button class="sub-btn" data-title="ALOT - Chapter 2">Chapter 2</button>
                    <button class="sub-btn" data-title="ALOT - Chapter 3">Chapter 3</button>
                </div>
            </div>
        </div>

        <!-- CONTENT AREA (footer only) -->
        <div class="content-area">
            <footer>
                <p>© 2026 Gathur Delano Kafka.</p>
                <p>Written by Arde</p>
            </footer>
        </div>
    </div>

    <!-- ===== FULLSCREEN PDF OVERLAY ===== -->
    <div class="pdf-overlay" id="pdfOverlay">
        <div class="pdf-overlay-content">
            <div class="pdf-overlay-header">
                <h3 id="pdfOverlayTitle">Loading...</h3>
                <button class="pdf-overlay-close" id="pdfOverlayClose">&times;</button>
            </div>
            <div class="pdf-overlay-body" id="pdfOverlayBody">
                <div class="pdf-placeholder-text" id="pdfPlaceholder">
                    <i class="fas fa-file-pdf"></i>
                    <span>Loading PDF...</span>
                </div>
                <iframe id="pdfOverlayIframe" style="display: none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Dropdown toggles
            const navBtns = document.querySelectorAll('.nav-btn');
            const subMenus = {
                jackdaw: document.getElementById('sub-jackdaw'),
                threats: document.getElementById('sub-threats')
            };

            // Default: semua dropdown tertutup
            subMenus.jackdaw.classList.remove('open');
            subMenus.threats.classList.remove('open');
            navBtns.forEach(btn => btn.classList.remove('open'));

            navBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const target = this.getAttribute('data-target');
                    const sub = subMenus[target];
                    if (sub) {
                        sub.classList.toggle('open');
                        this.classList.toggle('open');
                    }
                });
            });

            // ===== PDF OVERLAY =====
            const overlay = document.getElementById('pdfOverlay');
            const overlayTitle = document.getElementById('pdfOverlayTitle');
            const overlayIframe = document.getElementById('pdfOverlayIframe');
            const overlayPlaceholder = document.getElementById('pdfPlaceholder');
            const closeBtn = document.getElementById('pdfOverlayClose');

            function openPdf(title, pdfUrl) {
                overlayTitle.textContent = title;

                if (pdfUrl) {
                    overlayPlaceholder.style.display = 'none';
                    overlayIframe.style.display = 'block';
                    overlayIframe.src = pdfUrl;
                } else {
                    overlayPlaceholder.style.display = 'flex';
                    overlayPlaceholder.innerHTML = `
                        <i class="fas fa-book-open" style="font-size: 40px; color: #ccc; margin-right: 14px;"></i>
                        <span>Coming Soon</span>
                    `;
                    overlayIframe.style.display = 'none';
                    overlayIframe.src = '';
                }

                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePdf() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                overlayIframe.src = '';
                overlayIframe.style.display = 'none';
                overlayPlaceholder.style.display = 'flex';
                overlayPlaceholder.innerHTML = `
                    <i class="fas fa-file-pdf" style="font-size: 40px; color: #ccc; margin-right: 14px;"></i>
                    <span>Loading PDF...</span>
                `;
            }

            closeBtn.addEventListener('click', closePdf);

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    closePdf();
                }
            });

            window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closePdf();
                }
            });

            const subBtns = document.querySelectorAll('.sub-btn');

            subBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const title = this.getAttribute('data-title') || 'Chapter';
                    const pdf = this.getAttribute('data-pdf') || null;

                    openPdf(title, pdf);

                    subBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        })();
    </script>
</body>
                                                                                                                                                                            </html>
