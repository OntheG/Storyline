<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Main Story - Gathur Delano Kafka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #ffffff;
            color: #111;
            line-height: 1.5;
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 32px;
            padding: 32px 24px 28px;
            margin-bottom: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.02);
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-title {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .header-sub {
            color: #777;
            font-size: 1rem;
            font-weight: 400;
        }

        @media (min-width: 860px) {
            body {
                padding: 32px 40px;
            }

            .main-container {
                display: flex;
                gap: 40px;
                align-items: flex-start;
            }

            .sidebar {
                width: 280px;
                flex-shrink: 0;
                position: sticky;
                top: 32px;
            }

            .content-area {
                flex: 1;
                min-width: 0;
            }

            .navigation-buttons {
                flex-direction: column;
                gap: 8px;
            }

            .nav-btn {
                padding: 14px 20px;
                font-size: 1rem;
                border-radius: 16px;
                text-align: left;
                background: #fafafa;
            }
        }

        .navigation-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: #f8f8f8;
            border: 1px solid #dddddd;
            border-radius: 16px;
            padding: 12px 18px;
            font-weight: 550;
            font-size: 0.95rem;
            text-align: left;
            color: #1a1a1a;
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-btn:hover {
            background: #222;
            color: white;
            border-color: #222;
            transform: translateY(-2px);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn .arrow {
            font-size: 0.8rem;
            transition: transform 0.25s ease;
        }

        .nav-btn.open .arrow {
            transform: rotate(180deg);
        }

        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding-left: 16px;
            margin-top: 4px;
            border-left: 2px solid #ddd;
        }

        .sub-menu.open {
            display: flex;
        }

        .sub-btn {
            background: transparent;
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            width: 100%;
        }

        .sub-btn:hover {
            background: #f0f0f0;
            color: #000;
        }

        .sub-btn.active {
            background: #e8e8e8;
            font-weight: 600;
            color: #000;
        }

        .content-area {
            min-height: 400px;
        }

        footer {
            text-align: center;
            padding: 32px 20px 20px;
            border-top: 1px solid #e2e2e2;
            margin-top: 25px;
            color: #5a5a5a;
        }

        @media (max-width: 600px) {
            header { padding: 24px 16px; }
            .header-title { font-size: 1.8rem; }
            .nav-btn {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 860px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: static;
            }
        }

        /* ===== FULLSCREEN PDF OVERLAY ===== */
        .pdf-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .pdf-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .pdf-overlay-content {
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            0% { transform: scale(0.92) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .pdf-overlay-header {
            padding: 16px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            flex-shrink: 0;
        }

        .pdf-overlay-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .pdf-overlay-close {
            background: none;
            border: none;
            font-size: 32px;
            color: #333;
            cursor: pointer;
            padding: 0 8px;
            transition: all 0.2s;
            line-height: 1;
        }

        .pdf-overlay-close:hover {
            color: #000;
            transform: scale(1.1);
        }

        .pdf-overlay-body {
            flex: 1;
            background: #f1f3f5;
            padding: 16px;
            overflow: hidden;
        }

        .pdf-overlay-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .pdf-placeholder-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1.1rem;
            background: #fafafa;
            border-radius: 12px;
        }

        .pdf-placeholder-text i {
            font-size: 40px;
            margin-right: 14px;
            color: #ccc;
        }

        @media (max-width: 600px) {
            .pdf-overlay-content {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            .pdf-overlay {
                padding: 0;
            }
            .pdf-overlay-header h3 {
                font-size: 1rem;
                max-width: 70%;
            }
            .pdf-overlay-close {
                font-size: 28px;
            }
            .pdf-overlay-body {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="header-title">Main Story</h1>
            <p class="header-sub">Gathur Delano Kafka · Narrative Archive</p>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="navigation-buttons">
                <!-- The Jackdaw -->
                <div class="nav-btn" data-target="jackdaw">
                    <span>The Jackdaw</span>
                    <span class="arrow"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="sub-menu" id="sub-jackdaw">
                    <button class="sub-btn" data-chapter="jackdaw-1" data-title="The Jackdaw - Chapter 1">Chapter 1</button>
                    <button class="sub-btn" data-chapter="jackdaw-2" data-title="The Jackdaw - Chapter 2">Chapter 2</button>
                    <button class="sub-btn" data-chapter="jackdaw-3" data-title="The Jackdaw - Chapter 3">Chapter 3</button>
                    <button class="sub-btn" data-chapter="jackdaw-4" data-title="The Jackdaw - Chapter 4">Chapter 4</button>
                    <button class="sub-btn" data-chapter="jackdaw-5" data-title="The Jackdaw - Chapter 5">Chapter 5</button>
                </div>

                <!-- A Language of Threats -->
                <div class="nav-btn" data-target="threats">
                    <span>A Language of Threats</span>
                    <span class="arrow"><i class="fas fa-chevron-down"></i></span>
                </div>
                <div class="sub-menu" id="sub-threats">
                    <button class="sub-btn" data-chapter="threats-1" data-title="ALOT - Chapter 1" data-pdf="https://drive.google.com/file/d/1cVY89y0fWVxdY155LNuMTwwuSFHOA_mG/preview">Chapter 1</button>
                    <button class="sub-btn" data-chapter="threats-2" data-title="ALOT - Chapter 2">Chapter 2</button>
                    <button class="sub-btn" data-chapter="threats-3" data-title="ALOT - Chapter 3">Chapter 3</button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <!-- Kosong — semua konten via overlay -->
            <footer>
                <p>© 2026 Gathur Delano Kafka.</p>
                <p style="margin-top:10px; font-size:14px; color:#888;">Written by Arde</p>
            </footer>
        </div>
    </div>

    <!-- ===== FULLSCREEN PDF OVERLAY ===== -->
    <div class="pdf-overlay" id="pdfOverlay">
        <div class="pdf-overlay-content">
            <div class="pdf-overlay-header">
                <h3 id="pdfOverlayTitle">Loading...</h3>
                <button class="pdf-overlay-close" id="pdfOverlayClose">&times;</button>
            </div>
            <div class="pdf-overlay-body" id="pdfOverlayBody">
                <div class="pdf-placeholder-text" id="pdfPlaceholder">
                    <i class="fas fa-file-pdf"></i>
                    <span>Loading PDF...</span>
                </div>
                <iframe id="pdfOverlayIframe" style="display: none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Dropdown toggles
            const navBtns = document.querySelectorAll('.nav-btn');
            const subMenus = {
                jackdaw: document.getElementById('sub-jackdaw'),
                threats: document.getElementById('sub-threats')
            };

            // Default: semua dropdown tertutup
            subMenus.jackdaw.classList.remove('open');
            subMenus.threats.classList.remove('open');
            navBtns.forEach(btn => btn.classList.remove('open'));

            navBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const target = this.getAttribute('data-target');
                    const sub = subMenus[target];
                    if (sub) {
                        sub.classList.toggle('open');
                        this.classList.toggle('open');
                    }
                });
            });

            // ===== PDF OVERLAY =====
            const overlay = document.getElementById('pdfOverlay');
            const overlayTitle = document.getElementById('pdfOverlayTitle');
            const overlayIframe = document.getElementById('pdfOverlayIframe');
            const overlayPlaceholder = document.getElementById('pdfPlaceholder');
            const closeBtn = document.getElementById('pdfOverlayClose');

            function openPdf(title, pdfUrl) {
                overlayTitle.textContent = title;

                if (pdfUrl) {
                    overlayPlaceholder.style.display = 'none';
                    overlayIframe.style.display = 'block';
                    overlayIframe.src = pdfUrl;
                } else {
                    // Coming soon
                    overlayPlaceholder.style.display = 'flex';
                    overlayPlaceholder.innerHTML = `
                        <i class="fas fa-book-open" style="font-size: 40px; color: #ccc; margin-right: 14px;"></i>
                        <span>Coming Soon</span>
                    `;
                    overlayIframe.style.display = 'none';
                    overlayIframe.src = '';
                }

                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePdf() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                overlayIframe.src = '';
                overlayIframe.style.display = 'none';
                overlayPlaceholder.style.display = 'flex';
                overlayPlaceholder.innerHTML = `
                    <i class="fas fa-file-pdf" style="font-size: 40px; color: #ccc; margin-right: 14px;"></i>
                    <span>Loading PDF...</span>
                `;
            }

            // Tombol close
            closeBtn.addEventListener('click', closePdf);

            // Klik di luar konten (background) untuk close
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    closePdf();
                }
            });

            // Tombol ESC
            window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closePdf();
                }
            });

            // ===== SUB BUTTON CLICK =====
            const subBtns = document.querySelectorAll('.sub-btn');

            subBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const title = this.getAttribute('data-title') || 'Chapter';
                    const pdf = this.getAttribute('data-pdf') || null;

                    openPdf(title, pdf);

                    // Highlight active
                    subBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        })();
    </script>
</body>
  </html>
